[project]
name = "unpod-sbc-call-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "unpod>=0.6.2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = [".", "quickstart"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
